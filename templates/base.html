<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TellMe</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #1d9bf0;
            --primary-hover: #1a8cd8;
            --danger: #f4212e;
            --bg: #f7f9f9;
            --surface: #ffffff;
            --border: #eff3f4;
            --text: #0f1419;
            --text-secondary: #536471;
            --radius: 16px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 53px;
        }
        .topbar .brand {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar .brand span { color: var(--primary); }
        .topbar nav { display: flex; align-items: center; gap: 8px; }
        .topbar nav a {
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .topbar nav a:hover {
            background: rgba(29,155,240,0.1);
            color: var(--primary);
            text-decoration: none;
        }
        .topbar nav a.active {
            background: var(--primary);
            color: white;
        }
        .topbar nav a.active:hover { background: var(--primary-hover); }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
            flex: 1;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); text-decoration: none; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover { background: rgba(15,20,25,0.05); text-decoration: none; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { opacity: 0.9; text-decoration: none; }
        .btn-sm { padding: 6px 14px; font-size: 13px; }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 16px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--border);
            flex-shrink: 0;
        }
        .avatar-sm { width: 32px; height: 32px; }
        .avatar-lg { width: 96px; height: 96px; }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            background: var(--bg);
            color: var(--text);
            transition: border 0.2s;
            margin-bottom: 12px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--surface);
        }
        textarea { resize: vertical; min-height: 100px; }
        input[type="file"] {
            padding: 8px;
            background: var(--surface);
            border-style: dashed;
        }

        .error { color: var(--danger); font-size: 14px; margin-bottom: 12px; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state h3 { margin-bottom: 4px; color: var(--text); }

        @media (max-width: 640px) {
            .container { padding: 8px; }
            .topbar .brand { font-size: 17px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">TellMe</div>
        <nav>
            {% if user.is_authenticated %}
                <a href="/posts/">Feed</a>
                <a href="/users/profile/{{ user.username }}/">Perfil</a>
                <a href="/users/logout/" class="btn btn-outline btn-sm">Salir</a>
            {% else %}
                <a href="/users/login/">Iniciar sesión</a>
                <a href="/users/register/" class="btn btn-primary btn-sm">Registrarse</a>
            {% endif %}
        </nav>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
