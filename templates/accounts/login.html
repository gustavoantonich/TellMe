{% extends 'base.html' %}

{% block content %}

<h2>Login TellMe</h2>

<form method="POST">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Usuario">
    <input type="password" name="password" placeholder="Contraseña">
    <button type="submit">Entrar</button>
</form>

{% for message in messages %}
    <p style="color:red">{{ message }}</p>
{% endfor %}

{% endblock %}
