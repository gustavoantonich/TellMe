{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
    <div class="card" style="text-align: center; padding: 32px;">
        <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 8px;">Restablecer contraseña</h2>
        <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 15px;">
            Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
        </p>

        <form method="POST" style="text-align: left;">
            {% csrf_token %}
            {{ form.email }}
            <button class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">Enviar enlace</button>
        </form>

        <p style="margin-top: 16px; font-size: 14px;">
            <a href="/users/login/">Volver al inicio de sesión</a>
        </p>
    </div>
</div>
{% endblock %}
