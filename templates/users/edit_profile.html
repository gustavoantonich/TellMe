{% extends "base.html" %}
{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <div class="card">
        <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 20px;">Editar perfil</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <label style="font-size: 13px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 4px;">Avatar</label>
            <input type="file" name="avatar" accept="image/*">

            <label style="font-size: 13px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 4px;">Biografía</label>
            <textarea name="bio" placeholder="Cuéntanos sobre ti...">{{ user.bio }}</textarea>

            <label style="font-size: 13px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 4px;">Ubicación</label>
            <input name="location" value="{{ user.location }}" placeholder="Ej: Madrid, España">

            <label style="font-size: 13px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 4px;">Sitio web</label>
            <input name="website" value="{{ user.website }}" placeholder="https://tusitio.com">

            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button class="btn btn-primary">Guardar cambios</button>
                <a href="/users/profile/{{ user.username }}/" class="btn btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
