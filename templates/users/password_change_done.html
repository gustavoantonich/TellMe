{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
    <div class="card" style="text-align: center; padding: 32px;">
        <div style="font-size: 48px; margin-bottom: 12px;">✅</div>
        <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 8px;">Contraseña cambiada</h2>
        <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 15px;">
            Tu contraseña se ha actualizado correctamente.
        </p>
        <a href="/users/profile/{{ user.username }}/" class="btn btn-primary">Volver al perfil</a>
    </div>
</div>
{% endblock %}
