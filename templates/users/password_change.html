{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
    <div class="card" style="padding: 32px;">
        <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 20px;">Cambiar contraseña</h2>
        <form method="POST" style="text-align: left;">
            {% csrf_token %}
            {{ form.old_password }}
            {{ form.new_password1 }}
            {{ form.new_password2 }}
            <button class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">Cambiar contraseña</button>
        </form>
    </div>
</div>
{% endblock %}
