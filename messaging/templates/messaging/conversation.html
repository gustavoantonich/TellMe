{% extends "base.html" %}
{% block content %}
<div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
    <a href="/messages/" style="font-size: 14px; color: var(--text-secondary);">&larr; Volver</a>
    <h1 style="font-size: 20px; font-weight: 800;">
        {% if other %}
            <a href="/users/profile/{{ other.username }}/" style="color: var(--text); text-decoration: none;">@{{ other.username }}</a>
        {% endif %}
    </h1>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; max-height: 60vh; overflow-y: auto;">
    {% for msg in messages %}
        <div style="display: flex; justify-content: {% if msg.sender == user %}flex-end{% else %}flex-start{% endif %};">
            <div style="max-width: 70%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.4; {% if msg.sender == user %}background: var(--primary); color: white;{% else %}background: var(--bg); color: var(--text);{% endif %}">
                <p>{{ msg.content }}</p>
                <div style="font-size: 11px; {% if msg.sender == user %}color: rgba(255,255,255,0.7);{% else %}color: var(--text-secondary);{% endif %} margin-top: 4px;">
                    {{ msg.created_at|date:"H:i" }}
                </div>
            </div>
        </div>
    {% empty %}
        <div class="card empty-state">
            <p style="color: var(--text-secondary);">No hay mensajes. Envia el primero.</p>
        </div>
    {% endfor %}
</div>

<form method="POST" style="display: flex; gap: 8px;">
    {% csrf_token %}
    <input type="text" name="content" placeholder="Escribe un mensaje..." required style="flex: 1; margin: 0;">
    <button class="btn btn-primary btn-sm" style="border-radius: 9999px;">Enviar</button>
</form>
{% endblock %}
