<!DOCTYPE html>
<html>
<head>
    <title>Feed TellMe</title>
</head>
<body>

<h1>Feed</h1>

{% for post in posts %}
    <div style="border:1px solid #ccc; margin:10px; padding:10px;">
        <strong>{{ post.user.username }}</strong>
        <p>{{ post.content }}</p>
    </div>
{% endfor %}

</body>
</html>
